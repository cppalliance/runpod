#
# munin-node configuration for the vLLM pod image.
#
# Mirrors what the Ansible-Munin role generates for a Debian/Ubuntu host.
# @MONITOR_IP_RE@ is substituted at image build time with the MONITOR_IP build
# arg, dots escaped, because munin matches allow lines as regular expressions.
#

log_level 4
log_file /var/log/munin/munin-node.log
pid_file /var/run/munin/munin-node.pid

background 1
setsid 1

user root
group root

# Regexps for files to ignore
ignore_file ~$
ignore_file DEADJOE$
ignore_file \.bak$
ignore_file %$
ignore_file \.dpkg-(tmp|new|old|dist)$
ignore_file \.rpm(save|new)$
ignore_file \.pod$

# A list of addresses that are allowed to connect. This must be a regular
# expression, since Net::Server does not understand CIDR-style notation
# unless the perl module Net::CIDR is installed.
allow ^127\.0\.0\.1$
allow ^::1$
allow ^@MONITOR_IP_RE@$

# Which address to bind to
host *

# And which port
port 4949
