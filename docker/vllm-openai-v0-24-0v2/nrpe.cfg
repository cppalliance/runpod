#
# NRPE configuration for the vLLM pod image.
#
# Mirrors what the Ansible-Nagios role generates for a Debian/Ubuntu host.
# @MONITOR_IP@ / @MONITOR_HOST@ are substituted at image build time from the
# MONITOR_IP / MONITOR_HOST build args.
#

log_file=/var/log/nagios/nrpe.log

pid_file=/var/run/nagios/nrpe.pid
server_port=5666

nrpe_user=nagios
nrpe_group=nagios

dont_blame_nrpe=0
debug=0
command_timeout=60

allowed_hosts=127.0.0.1,::1,@MONITOR_IP@,@MONITOR_HOST@

include_dir=/etc/nagios/nrpe.d/
