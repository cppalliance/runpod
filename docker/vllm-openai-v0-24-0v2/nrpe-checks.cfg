#
# NRPE checks, installed to /etc/nagios/nrpe.d/checks.cfg
#
# Thresholds match the nrpe_checks defaults in the Ansible-Nagios role.
# check_load uses -r (load divided by CPU count) instead of the role's
# vcpu-derived absolute numbers, so the same thresholds hold on any pod size.
#

command[check_load]=/usr/lib/nagios/plugins/check_load -r -w 1.0,0.75,0.5 -c 2.0,1.5,1.0
command[check_disk]=/usr/lib/nagios/plugins/check_disk -w 20% -c 10% -A -i '.gvfs' -i /run/user -i /run/lxcfs -i /run/docker -i /var/lib/docker -i /var/lib/kubelet -i '/snap/*' -i /sys/kernel/debug/tracing
command[check_swap]=/usr/lib/nagios/plugins/check_swap -w 30% -c 20%
command[check_mem]=/usr/lib/nagios/plugins/check_mem -w 70 -c 80
